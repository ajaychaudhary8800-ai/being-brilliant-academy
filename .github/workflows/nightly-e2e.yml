name: Nightly staging end-to-end QA

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-staging-e2e
  cancel-in-progress: true

jobs:
  role-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: "true"
      QA_BASE_URL: "https://main-staging.beingbrilliantedu.com"
      QA_ORGANIZATION_SLUG: "automate-qa-academy"
      QA_SUPER_ADMIN_EMAIL: ${{ secrets.QA_SUPER_ADMIN_EMAIL }}
      QA_SUPER_ADMIN_PASSWORD: ${{ secrets.QA_SUPER_ADMIN_PASSWORD }}
      QA_BRANCH_ADMIN_EMAIL: ${{ secrets.QA_BRANCH_ADMIN_EMAIL }}
      QA_BRANCH_ADMIN_PASSWORD: ${{ secrets.QA_BRANCH_ADMIN_PASSWORD }}
      QA_ACCOUNTANT_EMAIL: ${{ secrets.QA_ACCOUNTANT_EMAIL }}
      QA_ACCOUNTANT_PASSWORD: ${{ secrets.QA_ACCOUNTANT_PASSWORD }}
      QA_TEACHER_EMAIL: ${{ secrets.QA_TEACHER_EMAIL }}
      QA_TEACHER_PASSWORD: ${{ secrets.QA_TEACHER_PASSWORD }}
      QA_STUDENT_EMAIL: ${{ secrets.QA_STUDENT_EMAIL }}
      QA_STUDENT_PASSWORD: ${{ secrets.QA_STUDENT_PASSWORD }}
      QA_PARENT_EMAIL: ${{ secrets.QA_PARENT_EMAIL }}
      QA_PARENT_PASSWORD: ${{ secrets.QA_PARENT_PASSWORD }}
      QA_EMPLOYEE_EMAIL: ${{ secrets.QA_EMPLOYEE_EMAIL }}
      QA_EMPLOYEE_PASSWORD: ${{ secrets.QA_EMPLOYEE_PASSWORD }}
      QA_RUN_MUTATION_TESTS: "true"
      QA_ALLOW_MUTATIONS: "true"
      QA_AUTH_STATE_DIR: test-results/qa-auth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate QA configuration
        shell: bash
        run: |
          missing=0
          for name in \
            QA_SUPER_ADMIN_EMAIL QA_SUPER_ADMIN_PASSWORD \
            QA_BRANCH_ADMIN_EMAIL QA_BRANCH_ADMIN_PASSWORD \
            QA_ACCOUNTANT_EMAIL QA_ACCOUNTANT_PASSWORD \
            QA_TEACHER_EMAIL QA_TEACHER_PASSWORD \
            QA_STUDENT_EMAIL QA_STUDENT_PASSWORD \
            QA_PARENT_EMAIL QA_PARENT_PASSWORD \
            QA_EMPLOYEE_EMAIL QA_EMPLOYEE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Authenticate all QA roles once
        run: pnpm exec playwright test e2e/auth.setup.spec.ts --project=desktop-chromium --workers=1 --retries=0

      - name: Validate public portal selector
        run: pnpm exec playwright test e2e/public-and-auth.spec.ts --grep "portal selector" --workers=1 --retries=0

      - name: Align synthetic staging fixture
        env:
          QA_REUSE_AUTH_STATE: "true"
        run: pnpm exec playwright test e2e/qa-fixture.setup.spec.ts --project=desktop-chromium --grep "@fixture" --workers=1 --retries=0

      - name: Run all role and module smoke QA
        env:
          QA_REUSE_AUTH_STATE: "true"
        run: pnpm exec playwright test e2e/admin-navigation.spec.ts e2e/role-portals.spec.ts --grep "@smoke" --workers=1 --retries=0

      - name: Run guarded cross-role academic workflow
        env:
          QA_REUSE_AUTH_STATE: "true"
        run: pnpm exec playwright test e2e/full-workflows.spec.ts --project=desktop-chromium --grep "@workflow" --workers=1 --retries=0

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-staging-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            !test-results/qa-auth/**
          retention-days: 14
