name: One-time UI sync deployment

on:
  push:
    branches:
      - "deploy/ui-sync-20260924"

permissions:
  contents: read
  packages: write

concurrency:
  group: ui-sync-staging-production
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bba/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=ui-sync-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bba-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bba-web:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: package
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.1
        env:
          VERSION: ${{ needs.package.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          envs: VERSION,OWNER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/bba-staging
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            export BBA_COMPOSE_PROJECT_NAME=bba-staging
            export API_IMAGE="ghcr.io/$OWNER/bba-api:$VERSION"
            export WEB_IMAGE="ghcr.io/$OWNER/bba-web:$VERSION"
            docker compose --env-file .env.staging pull api web
            docker compose --env-file .env.staging up -d migrate
            docker compose --env-file .env.staging up -d --wait --remove-orphans
            curl -fkSs https://localhost/health/nginx
            curl -fkSs https://localhost/api/health/ready

  deploy-production:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.1
        env:
          VERSION: ${{ needs.package.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION,OWNER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/bba
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            export API_IMAGE="ghcr.io/$OWNER/bba-api:$VERSION"
            export WEB_IMAGE="ghcr.io/$OWNER/bba-web:$VERSION"
            docker compose --env-file .env.production pull api web
            docker compose --env-file .env.production up -d migrate
            docker compose --env-file .env.production up -d --wait --remove-orphans
            curl -fkSs https://localhost/health/nginx
            curl -fkSs https://localhost/api/health/ready
            docker image prune -f
