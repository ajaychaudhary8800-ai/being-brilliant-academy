name: Production deployment
on:
  workflow_dispatch:
  push: { tags: ["v*"] }
permissions: { contents: read, packages: write, id-token: write }
concurrency: { group: production, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs: { version: "${{ steps.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "version=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/bba-api:${{ steps.meta.outputs.version }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/bba-web:${{ steps.meta.outputs.version }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env: { VERSION: "${{ needs.publish.outputs.version }}", OWNER: "${{ github.repository_owner }}", GHCR_TOKEN: "${{ secrets.GHCR_DEPLOY_TOKEN }}" }
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          username: "${{ secrets.DEPLOY_USER }}"
          key: "${{ secrets.DEPLOY_SSH_KEY }}"
          envs: VERSION,OWNER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/bba
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            export API_IMAGE="ghcr.io/$OWNER/bba-api:$VERSION"
            export WEB_IMAGE="ghcr.io/$OWNER/bba-web:$VERSION"
            docker compose --env-file .env.production pull api web
            docker compose --env-file .env.production up -d migrate
            docker compose --env-file .env.production up -d --wait --remove-orphans
            curl -fkSs https://localhost/health/nginx
            docker image prune -f
