name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: bba_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bba_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate Playwright suite discovery
        run: pnpm exec playwright test --list
      - run: pnpm --filter @bba/api prisma:generate
      - run: pnpm --filter @bba/api exec prisma migrate deploy
      - name: Prepare dedicated integration database
        run: |
          echo 'CREATE DATABASE bba_integration;' | pnpm --filter @bba/api exec prisma db execute --schema prisma/schema.prisma --stdin
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public' pnpm --filter @bba/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: API regression and PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public
          RUN_POSTGRES_INTEGRATION: "1"
        run: pnpm --filter @bba/api test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Runtime health smoke test
        run: |
          pnpm --filter @bba/api start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/health/ready && exit 0; sleep 2; done
          cat api.log
          exit 1
  containers:
    runs-on: ubuntu-latest
    needs: verify
    env:
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - name: Build and validate backup container
        run: |
          docker build -t bba-backup:ci infra/backup
          docker run --rm --entrypoint sh bba-backup:ci -n /usr/local/bin/backup.sh
          docker run --rm --entrypoint sh bba-backup:ci -n /usr/local/bin/restore.sh
          docker run --rm --entrypoint sh bba-backup:ci -n /usr/local/bin/verify-offsite.sh
          docker run --rm --entrypoint sh bba-backup:ci -n /usr/local/bin/restore-from-s3.sh
          docker run --rm --entrypoint sh bba-backup:ci -n /usr/local/bin/configure-retention.sh
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: false, tags: bba-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: false, tags: bba-web:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
