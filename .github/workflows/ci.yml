name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: bba_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bba_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate SchoolOS V5 promotion lock and legacy staging veto
        run: node --test scripts/check-schoolos-v5-promotion.test.mjs
      - name: Validate V5 staging-only backup and API credential isolation
        run: |
          node --test scripts/check-schoolos-v5-r2-file-credentials.test.mjs
          node --test scripts/check-schoolos-v5-api-file-credentials.test.mjs
          # A CI runner has no access to the staging host's protected secrets.
          # Use disposable placeholders ONLY for Compose interpolation checks.
          sudo install -d -m 0700 /etc/schoolos/v5-staging
          printf 'RAZORPAY_KEY_SECRET=ci-disposable-test-only\nRAZORPAY_WEBHOOK_SECRET=ci-disposable-test-only\n' | sudo tee /etc/schoolos/v5-staging/razorpay-v5-api.env >/dev/null
          sudo chmod 0600 /etc/schoolos/v5-staging/razorpay-v5-api.env
          # Compose reads the root-only synthetic fixture as root; deployed staging requires a privileged Compose runner too.
          sudo -E docker compose -f docker-compose.schoolos-v5-staging.yml config --quiet
      - name: Validate V5-only Coolify staging source provenance and no-secret runtime inventory
        run: node --test scripts/schoolos-v5-staging-provenance.test.mjs
      - name: Validate isolated SchoolOS V5 Growth reconciliation dry-run safety
        run: node --test apps/api/scripts/schoolos-v5-growth-price-policy.test.mjs
      - name: Validate SchoolOS V5 release gate policy tests
        run: pnpm v5:release:test
      - name: Verify SchoolOS V5 release HOLD or evidence-backed READY status
        run: pnpm v5:release:check
      - name: Validate SchoolOS V5 private-demo safety and CRM routing
        run: node --test scripts/schoolos-v5-commercial-site.test.mjs
      - name: Validate Playwright suite discovery
        run: pnpm exec playwright test --list
      - run: pnpm --filter @bba/api prisma:generate
      - run: pnpm --filter @bba/api exec prisma migrate deploy
      - name: Prepare dedicated integration database
        run: |
          echo 'CREATE DATABASE bba_integration;' | pnpm --filter @bba/api exec prisma db execute --schema prisma/schema.prisma --stdin
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public' pnpm --filter @bba/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: API regression and PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public
          RUN_POSTGRES_INTEGRATION: "1"
        run: pnpm --filter @bba/api test
      - name: Validate launch readiness manifest
        run: pnpm launch:check
      - name: Validate ERP 4.0 software release readiness
        run: pnpm software:release:require-ready
      - run: pnpm typecheck
      - run: pnpm build
      - name: Runtime health smoke test
        run: |
          pnpm --filter @bba/api start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:4000/health/ready || { cat api.log; exit 1; }
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health/operational && exit 0
            sleep 2
          done
          cat api.log
          exit 1
  containers:
    runs-on: ubuntu-latest
    needs: verify
    env:
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - name: Validate Coolify pre-deploy pull semantics
        run: docker compose pull --ignore-buildable
      - name: Validate Coolify multi-service compose build
        env:
          DOCKER_BUILDKIT: "1"
        run: docker compose build --pull api migrate web nginx backup
