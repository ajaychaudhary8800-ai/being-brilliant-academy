name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: bba_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bba_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate SchoolOS V5 promotion lock and legacy staging veto
        run: node --test scripts/check-schoolos-v5-promotion.test.mjs
      - name: Validate V5 staging-only backup and API credential isolation
        run: |
          node --test scripts/check-schoolos-v5-r2-file-credentials.test.mjs
          node --test scripts/check-schoolos-v5-api-file-credentials.test.mjs
          node --test scripts/check-schoolos-v5-media-file-credentials.test.mjs
          # A CI runner has no access to the staging host's protected secrets.
          # Use disposable placeholders ONLY for Compose interpolation checks.
          sudo install -d -m 0700 /etc/schoolos/v5-staging
          printf 'RAZORPAY_KEY_SECRET=ci-disposable-test-only\nRAZORPAY_WEBHOOK_SECRET=ci-disposable-test-only\n' | sudo tee /etc/schoolos/v5-staging/razorpay-v5-api.env >/dev/null
          sudo chmod 0600 /etc/schoolos/v5-staging/razorpay-v5-api.env
          # Only synthetic test credentials on disposable CI runner, never real values.
          sudo install -m 0600 /dev/null /etc/schoolos/v5-staging/livekit-v5-api.env
          # Compose reads the root-only synthetic fixture as root; deployed staging requires a privileged Compose runner too.
          sudo -E docker compose -f docker-compose.schoolos-v5-staging.yml config --quiet
      - name: Validate V5-only Coolify staging source provenance and no-secret runtime inventory
        run: node --test scripts/schoolos-v5-staging-provenance.test.mjs
      - name: Guard Linux API entrypoint against Windows CRLF checkout
        run: node --test scripts/schoolos-v5-api-entrypoint-lf.test.mjs
      - name: Guard V5 backup/restore shell and libpq recovery compatibility
        run: node --test scripts/schoolos-v5-backup-restore-hardening.test.mjs
      - name: Test V5-only Growth approved ratebook check and strict staging guard
        run: node --test apps/api/scripts/schoolos-v5-growth-price-policy.test.mjs
      - name: Validate V5 read-only monitor and isolated restore utility safety
        run: python3 -m unittest discover -s scripts -p 'test_schoolos_v5_*.py'
      - name: Validate SchoolOS V5 release gate policy tests
        run: pnpm v5:release:test
      - name: Verify SchoolOS V5 release HOLD or evidence-backed READY status
        run: pnpm v5:release:check
      - name: Validate SchoolOS V5 private-demo safety and CRM routing
        run: node --test scripts/schoolos-v5-commercial-site.test.mjs
      - name: Validate Playwright suite discovery
        run: pnpm exec playwright test --list
      - run: pnpm --filter @bba/api prisma:generate
      - run: pnpm --filter @bba/api exec prisma migrate deploy
      - name: Prepare dedicated integration database
        run: |
          echo 'CREATE DATABASE bba_integration;' | pnpm --filter @bba/api exec prisma db execute --schema prisma/schema.prisma --stdin
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public' pnpm --filter @bba/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: API regression and PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bba_integration?schema=public
          RUN_POSTGRES_INTEGRATION: "1"
        run: pnpm --filter @bba/api test
      - name: Validate launch readiness manifest
        run: pnpm launch:check
      - name: Validate ERP 4.0 software release readiness
        run: pnpm software:release:require-ready
      - run: pnpm typecheck
      - run: pnpm build
      - name: Runtime health smoke test
        run: |
          pnpm --filter @bba/api start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:4000/health/ready || { cat api.log; exit 1; }
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health/operational && exit 0
            sleep 2
          done
          cat api.log
          exit 1
  containers:
    runs-on: ubuntu-latest
    needs: verify
    env:
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - name: Validate Coolify pre-deploy pull semantics
        run: docker compose pull --ignore-buildable
      - name: Validate Coolify multi-service compose build
        env:
          DOCKER_BUILDKIT: "1"
        run: docker compose build --pull api migrate web nginx backup
      - name: Build and verify actual corrected backup image with isolated synthetic restore
        env:
          DOCKER_BUILDKIT: "1"
          BBA_SYNTHETIC_BUILD: "true"
        run: |
          set -euo pipefail
          bash -n scripts/schoolos-v5-backup-synthetic-e2e.sh
          docker build --pull=false --tag v5-backup-restore-ci:ephemeral \
            --file infra/backup/Dockerfile infra/backup
          bash scripts/schoolos-v5-backup-synthetic-e2e.sh
      - name: Verify V5 API executable in actual source-pinned synthetic Docker image
        env:
          DOCKER_BUILDKIT: "1"
          SCHOOLOS_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build --pull=false \
            --build-arg "SCHOOLOS_BUILD_REVISION=${SCHOOLOS_BUILD_REVISION}" \
            --tag schoolos-v5-ci-lf-check:ephemeral \
            --file apps/api/Dockerfile .
          docker run --rm --pull=never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/sh schoolos-v5-ci-lf-check:ephemeral \
            -n /usr/local/bin/bba-api-entrypoint
          docker run --rm --pull=never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/cat schoolos-v5-ci-lf-check:ephemeral \
            /usr/local/bin/bba-api-entrypoint \
            | python3 -c 'import sys; b=sys.stdin.buffer.read(); sys.exit(0 if b and bytes([13]) not in b else 1)'
          echo "V5_API_CLEAN_IMAGE_ENTRYPOINT_SYNTAX=PASS"
          echo "V5_API_CLEAN_IMAGE_ENTRYPOINT_LF=PASS"
          echo "REAL_STAGING_IMAGE_ATTESTED=NO"
          echo "STAGING_DEPLOYMENT=NOT_PERFORMED"
      - name: Boot corrected API image with isolated synthetic PostgreSQL
        run: |
          set -euo pipefail
          sid="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="schoolos-ci-api-lf-net-${sid}"
          pg="schoolos-ci-api-lf-db-${sid}"
          api="schoolos-ci-api-lf-svc-${sid}"
          created_network=0
          created_pg=0
          created_api=0
          cleanup() {
            if [ "$created_api" -eq 1 ]; then docker rm -f "$api" >/dev/null 2>&1 || true; fi
            if [ "$created_pg" -eq 1 ]; then docker rm -f "$pg" >/dev/null 2>&1 || true; fi
            if [ "$created_network" -eq 1 ]; then docker network rm "$network" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          docker network create --internal --driver bridge "$network" >/dev/null
          created_network=1
          docker run -d --rm --pull=never --name "$pg" \
            --network "$network" --network-alias pg \
            --tmpfs /var/lib/postgresql/data:rw,size=1024m \
            --memory 1400m \
            -e POSTGRES_DB=schoolos_ci \
            -e POSTGRES_USER=schoolos_ci \
            -e POSTGRES_PASSWORD=synthetic_ci_credential_only \
            postgres:16-alpine >/dev/null
          created_pg=1
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$pg" pg_isready -U schoolos_ci -d schoolos_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "V5_CI_SYNTHETIC_POSTGRES=FAIL"
            exit 1
          fi
          echo "V5_CI_SYNTHETIC_POSTGRES=PASS"
          docker run -d --rm --pull=never --name "$api" \
            --network "$network" --network-alias api \
            --memory 2300m \
            --pids-limit 1024 \
            -e NODE_ENV=test \
            -e PORT=4000 \
            -e DATABASE_URL=postgresql://schoolos_ci:synthetic_ci_credential_only@pg:5432/schoolos_ci?schema=public \
            -e JWT_ACCESS_SECRET=synthetic-ci-only-access-token-secret-32-chars \
            -e JWT_REFRESH_SECRET=synthetic-ci-only-refresh-token-secret-32-chars \
            -e WEB_URL=http://web:3000 \
            -e STORAGE_DRIVER=local \
            -e LOCAL_STORAGE_PATH=/data/storage \
            -e REDIS_REQUIRED=false \
            -e LOG_LEVEL=silent \
            -e RAZORPAY_MODE=test \
            schoolos-v5-ci-lf-check:ephemeral >/dev/null
          created_api=1
          ready=0
          for attempt in $(seq 1 105); do
            if docker exec "$api" node -e 'fetch("http://127.0.0.1:4000/health/ready",{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))' >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! docker inspect "$api" --format '{{.State.Running}}' 2>/dev/null | grep -qx true; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "V5_CI_SYNTHETIC_API_READY=FAIL"
            exit 1
          fi
          echo "V5_CI_SYNTHETIC_API_READY=PASS"
          migrations="$(docker exec "$pg" psql -U schoolos_ci -d schoolos_ci -At -c 'SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL' 2>/dev/null)"
          if ! [[ "$migrations" =~ ^[0-9]+$ ]] || [ "$migrations" -lt 114 ]; then
            echo "V5_CI_SYNTHETIC_MIGRATIONS=FAIL"
            exit 1
          fi
          echo "V5_CI_SYNTHETIC_MIGRATIONS=PASS"
          echo "REAL_STAGING_DATA_ACCESSED=NO"
          echo "SOURCE_BUILD_SIGNED_PROVENANCE=NOT_ATTESTED"
          echo "STAGING_DEPLOYMENT=NOT_PERFORMED"
