name: Post production redeploy health

on:
  push:
    branches:
      - test/post-prod-health

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production readiness
        run: |
          response="$(curl -fsS --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 25 https://beingbrilliantedu.com/api/health/ready)"
          echo "$response"
          printf '%s' "$response" | jq -e '.status == "ready" and .checks.database == true and .checks.redis == true' >/dev/null
      - name: Check production homepage
        run: |
          curl -fsS --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 25 https://beingbrilliantedu.com/ >/dev/null
