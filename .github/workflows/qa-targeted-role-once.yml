name: One-time targeted role QA

on:
  push:
    branches:
      - "qa/targeted-role-final-20260924"

permissions:
  contents: read

concurrency:
  group: targeted-role-final-qa
  cancel-in-progress: true

env:
  CI: "true"
  QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
  QA_ORGANIZATION_SLUG: ${{ secrets.QA_ORGANIZATION_SLUG }}

jobs:
  super-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_SUPER_ADMIN_EMAIL: ${{ secrets.QA_SUPER_ADMIN_EMAIL }}
      QA_SUPER_ADMIN_PASSWORD: ${{ secrets.QA_SUPER_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Super Admin critical workspace
        run: pnpm exec playwright test e2e/admin-navigation.spec.ts --project=desktop-chromium --grep "super admin critical modules" --workers=1 --retries=0

  branch-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_BRANCH_ADMIN_EMAIL: ${{ secrets.QA_BRANCH_ADMIN_EMAIL }}
      QA_BRANCH_ADMIN_PASSWORD: ${{ secrets.QA_BRANCH_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Branch Admin core workspace
        run: pnpm exec playwright test e2e/admin-navigation.spec.ts --project=desktop-chromium --grep "branch admin core workspace" --workers=1 --retries=0

  accountant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_ACCOUNTANT_EMAIL: ${{ secrets.QA_ACCOUNTANT_EMAIL }}
      QA_ACCOUNTANT_PASSWORD: ${{ secrets.QA_ACCOUNTANT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Accountant finance workspace
        run: pnpm exec playwright test e2e/admin-navigation.spec.ts --project=desktop-chromium --grep "accountant finance workspace" --workers=1 --retries=0

  teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_TEACHER_EMAIL: ${{ secrets.QA_TEACHER_EMAIL }}
      QA_TEACHER_PASSWORD: ${{ secrets.QA_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Teacher portal and access boundary
        run: pnpm exec playwright test e2e/role-portals.spec.ts --project=desktop-chromium --grep "teacher workspace|teacher cannot" --workers=1 --retries=0

  parent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_PARENT_EMAIL: ${{ secrets.QA_PARENT_EMAIL }}
      QA_PARENT_PASSWORD: ${{ secrets.QA_PARENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Parent progress portal
        run: pnpm exec playwright test e2e/role-portals.spec.ts --project=desktop-chromium --grep "parent portal" --workers=1 --retries=0
