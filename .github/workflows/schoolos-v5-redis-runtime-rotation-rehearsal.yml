name: V5 Redis Runtime ACL and Rotation Synthetic Rehearsal

on:
  pull_request:
    paths:
      - "infra/redis/**"
      - "docker-compose.schoolos-v5-staging.yml"
      - "scripts/schoolos-v5-ci-redis-rotation-rehearsal.sh"
      - "scripts/schoolos-v5-ci-postgres-rotation-rehearsal.sh"
      - ".github/workflows/schoolos-v5-redis-runtime-rotation-rehearsal.yml"
      - "docs/SCHOOLOS_V5_PHASE1_REDIS_RUNTIME_SECRET_CONTAINMENT_20261107.md"

permissions:
  contents: read

concurrency:
  group: "v5-redis-rotation-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  docker-isolated-redis-auth:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'fix/schoolos-v5-phase1-redis-runtime-auth-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: "1"
      # All credentials are ephemeral and generated within the isolated test.
      REDIS_PASSWORD: ""
      POSTGRES_PASSWORD: ""
      DATABASE_URL: ""
    steps:
      - name: Checkout exact unmerged PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate entrypoint syntax and staging-only Redis commands
        shell: bash
        run: |
          set -euo pipefail
          sh -n infra/redis/schoolos-v5-redis-entrypoint.sh
          bash -n scripts/schoolos-v5-ci-redis-rotation-rehearsal.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          prod = Path("docker-compose.yml").read_text()
          stage = Path("docker-compose.schoolos-v5-staging.yml").read_text()
          if "--requirepass" in stage or "redis-cli --no-auth-warning -a" in stage:
              raise SystemExit("STAGING_REDIS_CMD_CREDENTIAL_EXPOSURE=FAIL")
          if "REDISCLI_AUTH" not in stage or "infra/redis/Dockerfile" not in stage:
              raise SystemExit("STAGING_REDIS_AUTH_FILE_MISSING")
          if "redis:7-alpine" not in prod:
              raise SystemExit("V4_SOURCE_UNEXPECTED_CHANGED")
          print("STAGING_REDIS_ARGV_STATIC_POLICY=PASS_SOURCE_ONLY")
          PY
      - name: Build a fresh disposable Redis ACL image and rehearse old-to-new auth
        shell: bash
        run: bash scripts/schoolos-v5-ci-redis-rotation-rehearsal.sh
      - name: Preserve operational release HOLD
        run: |
          echo "V5_PHASE1_SOURCE_REDIS_ARGV_HARDENING=PASS_ISOLATED_ONLY"
          echo "V5_ACTUAL_POSTGRES_REDIS_ROTATION=NOT_EXECUTED"
          echo "V5_PREVIOUS_SIGNED_ROLLBACK_PAIR=NOT_VERIFIED"
          echo "V5_STAGING_AND_PRODUCTION_CHANGED=NO"
          echo "V5_COMMERCIAL_GO=HOLD"

  docker-isolated-postgres-role-rotation:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'fix/schoolos-v5-phase1-redis-runtime-auth-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only generated synthetic credentials; never actual staging credentials.
      POSTGRES_PASSWORD: ""
      DATABASE_URL: ""
    steps:
      - name: Checkout exact immutable review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate synthetic PostgreSQL rehearsal input
        shell: bash
        run: bash -n scripts/schoolos-v5-ci-postgres-rotation-rehearsal.sh
      - name: Test TCP old-credential rejection, ALTER ROLE, and existing-volume restart
        shell: bash
        run: bash scripts/schoolos-v5-ci-postgres-rotation-rehearsal.sh
      - name: Preserve operator-only deployment boundary
        run: |
          echo "V5_POSTGRES_ROTATION_EVIDENCE=SYNTHETIC_ONLY"
          echo "V5_REAL_STAGING_CREDENTIAL_ROTATION=NOT_EXECUTED"
          echo "V5_SHARED_STAGING_AND_PRODUCTION_CHANGED=NO"
          echo "V5_COMMERCIAL_GO=HOLD"
