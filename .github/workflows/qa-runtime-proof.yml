name: Temporary platform-admin proof

on:
  push:
    branches:
      - ops/v2.0-production-operations

permissions:
  contents: read

jobs:
  platform-login:
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://main-staging.beingbrilliantedu.com"
      QA_SUPER_ADMIN_EMAIL: ${{ secrets.QA_SUPER_ADMIN_EMAIL }}
      QA_SUPER_ADMIN_PASSWORD: ${{ secrets.QA_SUPER_ADMIN_PASSWORD }}
    steps:
      - name: Test default workspace admin login
        shell: bash
        run: |
          payload="$(jq -n --arg email "$QA_SUPER_ADMIN_EMAIL" --arg password "$QA_SUPER_ADMIN_PASSWORD" '{email:$email,password:$password,portal:"admin",rememberMe:false}')"
          tmp="$(mktemp)"
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$tmp" -w '%{http_code}' -H 'Content-Type: application/json' -d "$payload" "$BASE_URL/api/v1/auth/login")"
          echo "http_status=$code"
          if [ "$code" = "200" ]; then
            jq '{role:.data.user.role, organizationId:.data.organization.id, organizationSlug:.data.organization.slug, billingRecovery:.data.user.billingRecovery}' "$tmp"
            exit 0
          fi
          jq '{error:.error}' "$tmp" || cat "$tmp"
          exit 1
