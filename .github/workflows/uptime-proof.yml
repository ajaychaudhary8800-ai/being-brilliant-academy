name: Immediate uptime proof

on:
  push:
    branches:
      - test/uptime-proof

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Check production readiness
        run: |
          response="$(curl -fsS --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 25 https://beingbrilliantedu.com/api/health/ready)"
          echo "$response"
          printf '%s' "$response" | jq -e '.status == "ready" and .checks.database == true and .checks.redis == true' >/dev/null

  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check main staging readiness
        run: |
          response="$(curl -fsS --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 25 https://main-staging.beingbrilliantedu.com/api/health/ready)"
          echo "$response"
          printf '%s' "$response" | jq -e '.status == "ready" and .checks.database == true and .checks.redis == true' >/dev/null
