user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /var/log/nginx/access.log json;
  sendfile on; tcp_nopush on; keepalive_timeout 65; server_tokens off;
  gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 6; gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  upstream api { server api:4000; keepalive 32; }
  upstream web { server web:3000; keepalive 32; }
  server { listen 80; server_name _; location = /health/nginx { return 200 'ok'; add_header Content-Type text/plain; } location / { return 301 https://$host$request_uri; } }
  server {
    listen 443 ssl http2; server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d; ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; upgrade-insecure-requests" always;
    client_max_body_size 15m;
    location = /health/nginx { return 200 'ok'; add_header Content-Type text/plain; }
    location = /api/health/live { proxy_pass http://api/health/live; proxy_set_header X-Forwarded-Proto https; }
    location = /api/health/ready { proxy_pass http://api/health/ready; proxy_set_header X-Forwarded-Proto https; }
    location /api/ { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 120s; }
    location /grafana/ { proxy_pass http://grafana:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; }
  }
}
